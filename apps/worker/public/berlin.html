<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp.cashu.exchange — chat</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #f7931a;
        --ok: #34d399;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text);
        font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: baseline; gap: 14px;
        padding: 14px 18px; border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 16px; margin: 0; }
      header h1 b { color: var(--accent); }
      header a { color: var(--muted); font-size: 13px; text-decoration: none; }
      header a:hover { color: var(--text); }
      header .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
      .programme {
        align-self: flex-start; font-size: 11px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--accent);
        border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px;
        margin-bottom: 2px;
      }
      #log {
        flex: 1; overflow-y: auto; padding: 18px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .msg {
        max-width: 78%; padding: 10px 14px; border-radius: 12px;
        white-space: pre-wrap; line-height: 1.45; font-size: 14px;
      }
      .user { align-self: flex-end; background: #2b3a4a; }
      .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
      .offer {
        margin-top: 10px; padding: 12px; border: 1px dashed var(--accent);
        border-radius: 10px; font-size: 13px;
      }
      .offer .sats { color: var(--accent); font-weight: 600; }
      .offer textarea {
        width: 100%; height: 54px; margin-top: 8px; resize: vertical;
        background: var(--bg); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px; font-size: 12px; font-family: ui-monospace, monospace;
      }
      .offer button, form button {
        margin-top: 8px; background: var(--accent); color: #111; border: 0;
        border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer;
      }
      .ticket {
        display: inline-block; margin: 6px 6px 0 0; padding: 8px 12px;
        border: 1px dashed var(--ok); border-radius: 8px; color: var(--ok);
        font-family: ui-monospace, monospace; font-size: 13px;
      }
      form {
        display: flex; gap: 10px; padding: 14px 18px;
        border-top: 1px solid var(--border); background: var(--panel);
      }
      form input {
        flex: 1; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px;
      }
      .status { font-size: 12px; color: var(--muted); align-self: center; }
      .err { color: var(--err); }
    </style>
  </head>
  <body>
    <header>
      <h1><b>mcp</b>.cashu.exchange <span class="sub">/demo</span></h1>
      <a href="/map.html">map</a>
      <a href="https://github.com/Amperstrand/mcp-cashu-exchange">github</a>
    </header>
    <div id="log"></div>
    <form id="composer">
      <input id="message" placeholder='e.g. "2 tickets for Vaterland"' autocomplete="off" autofocus />
      <button type="submit">Send</button>
    </form>
    <script>
      const log = document.getElementById("log");
      const composer = document.getElementById("composer");
      const input = document.getElementById("message");
      const session = sessionStorage.getItem("mcpex-session") ?? crypto.randomUUID();
      sessionStorage.setItem("mcpex-session", session);
      let currentOffer = null;

      function addMsg(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      function renderOffer(offer) {
        const bot = addMsg("", "bot");
        const card = document.createElement("div");
        card.className = "offer";
        card.innerHTML =
          `<div>${offer.title}</div>` +
          `<div class="sats">${offer.amount_sats} sat</div>` +
          `<div class="status">Paste a Cashu token (mint: cdk-a056e0f.cashu.exchange) to pay</div>`;
        const ta = document.createElement("textarea");
        ta.placeholder = "cashuAey…";
        const btn = document.createElement("button");
        btn.textContent = "Pay";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Redeeming…";
          try {
            const res = await fetch("/api/chat/pay", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ session, offer_id: offer.offer_id, token: ta.value.trim() }),
            });
            const data = await res.json();
            const box = addMsg(data.reply, "bot");
            if (data.tickets?.length) {
              for (const t of data.tickets) {
                const tick = document.createElement("span");
                tick.className = "ticket";
                tick.textContent = t;
                box.appendChild(tick);
              }
            } else if (data.error) {
              box.classList.add("err");
            }
            card.remove();
            currentOffer = null;
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Pay";
            addMsg("network error: " + e.message, "bot err");
          }
        });
        card.append(ta, btn);
        bot.appendChild(card);
        log.scrollTop = log.scrollHeight;
      }

      composer.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        await send(text);
      });

      async function send(text) {
        addMsg(text, "user");
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ message: text, session }),
          });
          const data = await res.json();
          addMsg(data.reply, "bot");
          if (data.offer) renderOffer(data.offer);
        } catch (e) {
          addMsg("network error: " + e.message, "bot err");
        }
      }

      addMsg(
        "Hi! I'm the mcp.cashu.exchange box office for tonight's real Berlin " +
          "cinema programme (Yorck). Ask me what's playing, name a film — " +
          "you pay in Cashu ecash, I hand you ticket codes.",
        "bot",
      );
      const tag = document.createElement("div");
      tag.className = "programme";
      tag.textContent = "Real programme · yorck.de · Berlin tonight";
      log.appendChild(tag);

      // Demo autostart: the listing appears on load, no interaction needed.
      send("what's playing today?");
    </script>
  </body>
</html>
