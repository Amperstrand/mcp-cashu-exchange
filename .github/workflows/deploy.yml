name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated: environment 'production' requires a reviewer, and its secrets
    # (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) exist only there.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Leak gate (publication policy)
        run: node scripts/leak-scan.mjs . --history
      - run: npx biome check .
      - run: npm run typecheck
      - run: npm test
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
